name: CI

on:
  pull_request:
    paths:
      - "*.yaml"
      - "components/**"
      - "test/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "*.yaml"
      - "components/**"
      - "test/**"
      - ".github/workflows/ci.yml"
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native C++ Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GoogleTest
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev libgmock-dev cmake g++
      - name: Compile and run native tests
        run: |
          g++ -std=c++17 -pthread \
            -Icomponents/outequip_ac \
            test/test_native/ac_framer_test.cpp \
            components/outequip_ac/ac_framer.cpp \
            -lgtest -lgmock \
            -o test_framer
          ./test_framer

  ci:
    name: Building ${{ matrix.file }} / ${{ matrix.esphome-version }}
    runs-on: ubuntu-latest
    needs: [native-tests]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        file:
          - outequip-ac
        esphome-version:
          - stable
          - beta
          - dev
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ESPHome ${{ matrix.esphome-version }}
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667 # v8.1.0
        with:
          yaml-file: ${{ matrix.file }}.yaml
          version: ${{ matrix.esphome-version }}
