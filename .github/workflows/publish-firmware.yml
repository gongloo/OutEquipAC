name: Publish Firmware

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build Firmware
    uses: esphome/workflows/.github/workflows/build.yml@b2c0cffae477d81175c67e6a44651a9bc2b49f6f # 2026.11.0
    with:
      files: |
        outequip-ac.yaml
      release-summary: ${{ github.event.release.body }}
      release-url: ${{ github.event.release.html_url }}
      release-version: ${{ github.event.release.tag_name }}

  upload-to-release:
    name: Upload to Release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@b2c0cffae477d81175c67e6a44651a9bc2b49f6f # 2026.11.0
    needs:
      - build-firmware
    with:
      version: ${{ github.event.release.tag_name }}
