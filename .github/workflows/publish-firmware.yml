name: Publish Firmware

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build Firmware
    uses: esphome/workflows/.github/workflows/build.yml@7f0b0f230ba1b9fa1361e699b3a2043c92f0d3f3 # 2026.11.1
    with:
      files: |
        outequip-ac.yaml
      release-summary: ${{ github.event.release.body }}
      release-url: ${{ github.event.release.html_url }}
      release-version: ${{ github.event.release.tag_name }}

  upload-to-release:
    name: Upload to Release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@7f0b0f230ba1b9fa1361e699b3a2043c92f0d3f3 # 2026.11.1
    needs:
      - build-firmware
    with:
      version: ${{ github.event.release.tag_name }}
