substitutions:
  name: "outequip-ac"
  friendly_name: "OutEquip AC"
  stats_update_interval_s: "10"

  # Source location of the custom external components.
  # Can be a local path string or a git repository source block.
  outequip_ac_component_source: "components"
  web_host_component_source: "github://gongloo/esphome-web-host@v2.1.1"
  influxdb_udp_component_source: "github://gongloo/esphome-influxdb-udp@v1.0.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: "gongloo.${name}"
    version: "2.3.0"
  min_version: 2026.10.0

external_components:
  - source: ${outequip_ac_component_source}
    id: "outequip_ac_component"
    components: [outequip_ac]
  - source: ${web_host_component_source}
    id: "web_host_component"
    components: [web_host]
  - source: ${influxdb_udp_component_source}
    id: "influxdb_udp_component"
    components: [influxdb_udp]

esp32:
  board: nologo_esp32c3_super_mini
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

web_server:
  version: 3
  local: true
  sorting_groups:
    - id: climate_section
      name: "Climate"
      sorting_weight: 10
    - id: switches_section
      name: "Switches"
      sorting_weight: 20
    - id: electrical_section
      name: "Electrical"
      sorting_weight: 30
    - id: udp_settings
      name: "UDP Configuration"
      sorting_weight: 60
    - id: host_section
      name: "Host"
      sorting_weight: 100

uart:
  id: uart_bus
  tx_pin: 4
  rx_pin: 3
  baud_rate: 115200

outequip_ac:
  id: ac_device
  uart_id: uart_bus

climate:
  - platform: outequip_ac
    outequip_ac_id: ac_device
    name: "Thermostat"
    id: ac_climate
    web_server:
      sorting_group_id: climate_section

switch:
  - platform: outequip_ac
    outequip_ac_id: ac_device
    lcd:
      name: "LCD Backlight"
      id: ac_lcd
      web_server:
        sorting_group_id: switches_section
    swing:
      name: "Swing"
      internal: true # Summit2 lacks swing feature
      id: ac_swing
      web_server:
        sorting_group_id: switches_section
    light:
      name: "Light"
      id: ac_light
      web_server:
        sorting_group_id: switches_section

sensor:
  - platform: outequip_ac
    outequip_ac_id: ac_device
    intake_temp:
      name: "Intake Air Temp"
      id: ac_intake_temp
      web_server:
        sorting_group_id: climate_section
    outlet_temp:
      name: "Outlet Air Temp"
      id: ac_outlet_temp
      web_server:
        sorting_group_id: climate_section
    voltage:
      name: "Voltage"
      id: ac_voltage
      web_server:
        sorting_group_id: electrical_section
    undervolt:
      name: "Undervolt Protect"
      id: ac_undervolt
      web_server:
        sorting_group_id: electrical_section
    overvolt:
      name: "Overvolt Protect"
      id: ac_overvolt
      web_server:
        sorting_group_id: electrical_section
    amperage:
      name: "Amperage"
      internal: true # Summit2 always reports zero
      id: ac_amperage
      web_server:
        sorting_group_id: electrical_section

web_host:
  files:
    - id: ui_page
      file: "data/htdocs/thermostat.html"
      url: "/thermostat"
    - id: ui_manifest
      file: "data/htdocs/manifest.webmanifest"
      url: "/manifest.webmanifest"
    - id: ui_sw
      file: "data/htdocs/sw.js"
      url: "/sw.js"
    - id: ui_favicon
      file: "data/htdocs/favicon.ico"
      url: "/favicon.ico"
    - id: ui_apple_touch_icon
      file: "data/htdocs/apple-touch-icon.png"
      url: "/apple-touch-icon.png"
    - id: ui_icon_96
      file: "data/htdocs/icon-96.png"
      url: "/icon-96.png"

influxdb_udp:
  host_text_id: influxdb_host_text
  port_number_id: influxdb_port_number
  tags:
    host: "${name}"
  measurements:
    - measurement: outequip-ac
      id: outequip_stats
      update_interval: ${stats_update_interval_s}s
      fields:
        power:
          type: string
          lambda: |-
            switch (id(ac_device)->power_state()) {
              case ACFramer::OnOffValue::On: return "on";
              case ACFramer::OnOffValue::Off: return "off";
              default: return "query";
            }
        mode:
          type: string
          lambda: |-
            switch (id(ac_device)->cur_mode()) {
              case ACFramer::ModeValue::Cool: return "cool";
              case ACFramer::ModeValue::Heat: return "heat";
              case ACFramer::ModeValue::Fan: return "fan";
              case ACFramer::ModeValue::Eco: return "eco";
              case ACFramer::ModeValue::Sleep: return "sleep";
              case ACFramer::ModeValue::Turbo: return "turbo";
              case ACFramer::ModeValue::Wet: return "wet";
              default: return "query";
            }
        set_temp:
          lambda: |-
            if (std::isnan(id(ac_climate).target_temperature)) return std::optional<int32_t>{};
            return std::optional<int32_t>{static_cast<int32_t>(std::lround((id(ac_climate).target_temperature * 9.0f / 5.0f) + 32.0f))};
        fan_speed:
          type: uint
          lambda: "return static_cast<uint32_t>(id(ac_device)->fan_speed());"
        undervolt: ac_undervolt
        overvolt:
          sensor: ac_overvolt
          type: int
        intake_temp:
          sensor: ac_intake_temp
          type: int
        outlet_temp:
          sensor: ac_outlet_temp
          type: int
        lcd:
          type: string
          lambda: |-
            if (!id(ac_lcd).has_state()) return "query";
            return id(ac_lcd).state ? "on" : "off";
        light:
          type: string
          lambda: |-
            if (!id(ac_light).has_state()) return "query";
            return id(ac_light).state ? "on" : "off";
        voltage: ac_voltage
        uptime_ms:
          type: uint
          lambda: "return millis();"
        frames_tx:
          type: uint
          lambda: "return id(ac_device)->num_frames_tx();"
        frames_rx:
          type: uint
          lambda: "return id(ac_device)->num_frames_rx();"
        frames_failed:
          type: uint
          lambda: "return id(ac_device)->num_frames_failed();"
        spurious_bytes_rx:
          type: uint
          lambda: "return id(ac_device)->num_spurious_bytes_rx();"

script:
  - id: report_stats
    then:
      - influxdb_udp.publish: outequip_stats

text:
  - platform: template
    mode: text
    name: "InfluxDB IP"
    id: influxdb_host_text
    icon: "mdi:table-network"
    optimistic: true
    max_length: 15
    restore_value: true
    entity_category: "config"
    web_server:
      sorting_group_id: "udp_settings"

number:
  - platform: template
    name: "InfluxDB Port"
    id: influxdb_port_number
    icon: "mdi:numeric"
    optimistic: true
    min_value: 1
    max_value: 65535
    initial_value: 8089
    step: 1
    restore_value: true
    entity_category: "config"
    web_server:
      sorting_group_id: "udp_settings"

button:
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: "diagnostic"
    web_server:
      sorting_group_id: "host_section"
